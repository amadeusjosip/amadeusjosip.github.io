<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piramida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#4a3b32;

    --coral:#ff8a65;
    --coral-dark:#e0673f;
    --turquoise:#4ecdc4;
    --turquoise-dark:#2fa79d;
    --sunny:#ffd93d;
    --sunny-dark:#eab308;
    --grass:#8bc34a;
    --grass-dark:#6b9e36;
    --sky:#4fc3f7;
    --sky-dark:#2b9fd9;
    --purple:#b388ff;
    --purple-dark:#9163e8;
    --pink:#ff7aa2;
    --pink-dark:#e85d87;

    --panel:#ffffff;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    color:var(--ink);
    font-family:'Baloo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(circle at 12% 18%, #fff2c8 0%, transparent 42%),
      radial-gradient(circle at 88% 12%, #c9f0ff 0%, transparent 40%),
      radial-gradient(circle at 85% 88%, #ffd6e6 0%, transparent 45%),
      radial-gradient(circle at 10% 85%, #d9f7d0 0%, transparent 42%),
      linear-gradient(160deg, #fff6e6 0%, #eaf7ff 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* floating decorative blobs */
  .blob{
    position:fixed;
    border-radius:50%;
    opacity:.55;
    filter:blur(1px);
    z-index:0;
  }
  .blob1{width:120px;height:120px;background:var(--sunny);top:8%;left:6%;}
  .blob2{width:70px;height:70px;background:var(--pink);bottom:12%;left:10%;}
  .blob3{width:100px;height:100px;background:var(--sky);top:10%;right:8%;}
  .blob4{width:60px;height:60px;background:var(--grass);bottom:8%;right:10%;}

  #flash{
    position:fixed;
    inset:0;
    background:var(--grass-dark);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
    z-index:50;
  }
  #flash.on{opacity:.4;}
  #flash.wrong{background:var(--pink-dark);}

  #confetti-canvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:60;
  }

  .stage{
    position:relative;
    z-index:1;
    display:flex;
    align-items:flex-start;
    gap:28px;
    padding:24px;
  }

  .panel{
    background:var(--panel);
    border:5px solid #fff;
    border-radius:32px;
    box-shadow:0 10px 0 rgba(74,59,50,0.10), 0 16px 28px rgba(74,59,50,0.14);
    padding:22px 20px;
  }

  /* side panel */
  .side-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    margin-top:44px;
  }
  .side-label{
    font-size:12px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.55;
    margin-bottom:2px;
  }
  .row-btn{
    width:48px;
    height:48px;
    border-radius:50%;
    border:4px solid #fff;
    background:var(--purple);
    color:#fff;
    font-family:inherit;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 5px 0 var(--purple-dark);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .row-btn:hover{transform:translateY(-2px);}
  .row-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--purple-dark);}
  .row-btn.active{
    background:var(--pink);
    box-shadow:0 5px 0 var(--pink-dark);
    transform:scale(1.08);
  }

  /* main */
  .main{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }

  .title{
    font-size:26px;
    font-weight:800;
    margin:0 0 4px 0;
    text-align:center;
  }

  .pyramid{
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .row{
    display:flex;
    justify-content:center;
    gap:9px;
  }
  .cell{
    width:54px;
    height:54px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    font-weight:800;
  }
  .cell.given{
    background:var(--sunny);
    color:#7a5c00;
    border:4px solid #fff;
    box-shadow:0 4px 0 var(--sunny-dark);
  }
  .cell input{
    width:100%;
    height:100%;
    text-align:center;
    font-size:19px;
    font-weight:800;
    font-family:inherit;
    color:var(--ink);
    background:#f4fbfb;
    border:4px solid var(--turquoise);
    border-radius:16px;
    box-shadow:0 4px 0 var(--turquoise-dark);
    transition:border-color .12s ease, box-shadow .12s ease, transform .12s ease;
    -moz-appearance:textfield;
  }
  .cell input::-webkit-outer-spin-button,
  .cell input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .cell input:focus{
    outline:none;
    border-color:var(--purple);
    box-shadow:0 4px 0 var(--purple-dark);
  }

  .pyramid.shake{
    animation:shake .4s ease;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(7px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(4px);}
  }

  .btn-row{
    display:flex;
    gap:14px;
    margin-top:4px;
  }

  .btn{
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    letter-spacing:.01em;
    padding:13px 22px;
    border:4px solid #fff;
    border-radius:18px;
    cursor:pointer;
    color:#fff;
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .btn:active{transform:translateY(3px);}

  .btn-check{
    background:var(--grass);
    box-shadow:0 6px 0 var(--grass-dark);
  }
  .btn-check:active{box-shadow:0 3px 0 var(--grass-dark);}

  .btn-new{
    background:var(--coral);
    box-shadow:0 6px 0 var(--coral-dark);
  }
  .btn-new:active{box-shadow:0 3px 0 var(--coral-dark);}

  @media (max-width:560px){
    .stage{flex-direction:column;align-items:center;gap:18px;padding:16px;}
    .side-panel{flex-direction:row;margin-top:0;}
    .panel{padding:16px 12px;border-radius:26px;}
    .cell{width:40px;height:40px;font-size:14px;border-radius:12px;}
    .cell input{font-size:14px;border-radius:12px;}
    .row{gap:6px;}
    .pyramid{gap:6px;}
    .btn{padding:11px 16px;font-size:13px;}
    .btn-row{flex-wrap:wrap;justify-content:center;}
  }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="blob blob4"></div>

<div id="flash"></div>
<canvas id="confetti-canvas"></canvas>

<div class="stage">
  <div class="side-panel">
    <div class="side-label">Redci</div>
    <button class="row-btn" data-rows="4">4</button>
    <button class="row-btn" data-rows="5">5</button>
    <button class="row-btn" data-rows="6">6</button>
  </div>

  <div class="panel main">
    <h1 class="title">🔺 Piramida</h1>
    <div class="pyramid" id="pyramid"></div>
    <div class="btn-row">
      <button class="btn btn-check" id="checkBtn">Provjeri odgovore</button>
      <button class="btn btn-new" id="newBtn">Nova igra</button>
    </div>
  </div>
</div>

<script>
const pyramidEl = document.getElementById('pyramid');
const newBtn = document.getElementById('newBtn');
const checkBtn = document.getElementById('checkBtn');
const flashEl = document.getElementById('flash');
const rowButtons = document.querySelectorAll('.row-btn');

let currentRows = 6;
let solution = [];
let hidden = [];
let inputs = [];
let busy = false;

function randInt(min, max){
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// Top value is guaranteed <= 100: top = sum of C(rows-1, i) * bottom[i],
// and the total of those coefficients is 2^(rows-1), so capping each
// bottom cell at floor(100 / 2^(rows-1)) guarantees the worst case stays <= 100.
function bottomCap(rows){
  return Math.max(1, Math.floor(100 / Math.pow(2, rows - 1)));
}

function generatePuzzle(rows){
  currentRows = rows;
  solution = [];
  hidden = [];

  const cap = bottomCap(rows);
  const bottom = [];
  for(let i = 0; i < rows; i++) bottom.push(randInt(1, cap));
  solution[rows - 1] = bottom;

  for(let r = rows - 2; r >= 0; r--){
    const row = [];
    const below = solution[r + 1];
    for(let i = 0; i <= r; i++){
      row.push(below[i] + below[i + 1]);
    }
    solution[r] = row;
  }

  // minimal reveal: only the bottom row is given, everything else
  // must be worked out (still always solvable by summing upward).
  for(let r = 0; r < rows; r++){
    const row = [];
    for(let i = 0; i <= r; i++){
      row.push(r !== rows - 1);
    }
    hidden[r] = row;
  }
}

function renderPyramid(){
  pyramidEl.innerHTML = '';
  inputs = [];
  busy = false;

  for(let r = 0; r < currentRows; r++){
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    inputs[r] = [];

    for(let i = 0; i <= r; i++){
      const cellEl = document.createElement('div');

      if(hidden[r][i]){
        cellEl.className = 'cell';
        const input = document.createElement('input');
        input.type = 'text';
        input.inputMode = 'numeric';
        input.maxLength = 3;
        input.addEventListener('input', () => {
          input.value = input.value.replace(/[^0-9]/g, '');
        });
        cellEl.appendChild(input);
        inputs[r][i] = input;
      } else {
        cellEl.className = 'cell given';
        cellEl.textContent = solution[r][i];
        inputs[r][i] = null;
      }

      rowEl.appendChild(cellEl);
    }

    pyramidEl.appendChild(rowEl);
  }
}

function handleCheck(){
  if(busy) return;

  let allFilled = true;
  for(let r = 0; r < currentRows; r++){
    for(let i = 0; i <= r; i++){
      const input = inputs[r][i];
      if(input && input.value.trim() === ''){
        allFilled = false;
      }
    }
  }

  if(!allFilled){
    pyramidEl.classList.remove('shake');
    void pyramidEl.offsetWidth;
    pyramidEl.classList.add('shake');
    return;
  }

  let allCorrect = true;
  for(let r = 0; r < currentRows; r++){
    for(let i = 0; i <= r; i++){
      const input = inputs[r][i];
      if(input && parseInt(input.value, 10) !== solution[r][i]){
        allCorrect = false;
      }
    }
  }

  if(allCorrect){
    busy = true;
    flash(false);
    launchConfetti();
    setTimeout(() => startPuzzle(currentRows), 900);
  } else {
    flash(true);
  }
}

function flash(isWrong){
  flashEl.classList.toggle('wrong', isWrong);
  flashEl.classList.add('on');
  setTimeout(() => flashEl.classList.remove('on'), 500);
}

function startPuzzle(rows){
  generatePuzzle(rows);
  renderPyramid();
  setActiveRowButton(rows);
}

function setActiveRowButton(rows){
  rowButtons.forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.rows, 10) === rows);
  });
}

newBtn.addEventListener('click', () => startPuzzle(currentRows));
checkBtn.addEventListener('click', handleCheck);
rowButtons.forEach(btn => {
  btn.addEventListener('click', () => startPuzzle(parseInt(btn.dataset.rows, 10)));
});

startPuzzle(currentRows);

/* ---- confetti ---- */
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let confettiRunning = false;

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const confettiColors = ['#ff8a65', '#4ecdc4', '#ffd93d', '#8bc34a', '#4fc3f7', '#b388ff', '#ff7aa2'];

function launchConfetti(){
  particles = [];
  const count = 180;
  for(let i = 0; i < count; i++){
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 15,
      vy: (Math.random() - 1.6) * 15,
      size: randInt(5, 10),
      color: confettiColors[randInt(0, confettiColors.length - 1)],
      rotation: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.3,
      life: 0
    });
  }
  if(!confettiRunning){
    confettiRunning = true;
    requestAnimationFrame(animateConfetti);
  }
}

function animateConfetti(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let stillAlive = false;

  for(const p of particles){
    p.vy += 0.35;
    p.x += p.vx;
    p.y += p.vy;
    p.rotation += p.spin;
    p.life++;

    if(p.y < canvas.height + 20 && p.life < 220){
      stillAlive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    }
  }

  if(stillAlive){
    requestAnimationFrame(animateConfetti);
  } else {
    confettiRunning = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}
</script>

</body>
</html>
