<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piramida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a;
    --bg-yellow:#ffd83d;
    --card:#ffffff;
    --sky:#9ee8ff;
    --cream:#fff4cf;
    --grass:#8bd96b;

    --green:#3ddc84;
    --blue:#4fc3f7;
    --orange:#ffa94d;
    --pink:#ff7aa8;
    --purple:#b388ff;
    --red:#ff5f5f;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    min-height:100%;
    overflow:hidden;
    color:var(--ink);
    font-family:'Baloo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,.72) 0 28px, transparent 29px),
      radial-gradient(circle at 87% 13%, rgba(255,255,255,.55) 0 38px, transparent 39px),
      linear-gradient(#9ee8ff 0 68%, #b8e98c 68% 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px;
  }

  body::before,
  body::after{
    content:"";
    position:fixed;
    pointer-events:none;
    z-index:0;
  }
  body::before{
    width:150px;
    height:70px;
    left:-25px;
    top:12%;
    border-radius:50%;
    background:#fff7df;
    box-shadow:115px 25px 0 -8px #fff7df, 255px -10px 0 -15px #fff7df;
    opacity:.9;
  }
  body::after{
    width:100%;
    height:34%;
    left:0;
    bottom:0;
    background:
      radial-gradient(circle at 10% 80%, #6fc85e 0 42px, transparent 43px),
      radial-gradient(circle at 90% 82%, #78ce64 0 52px, transparent 53px);
    opacity:.9;
  }

  .sticker{
    position:fixed;
    width:50px;
    height:50px;
    background:#fff;
    border:4px solid var(--ink);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    box-shadow:0 4px 0 var(--ink);
    z-index:0;
  }
  .s1{top:5%;left:5%;transform:rotate(-12deg);}
  .s2{top:5%;right:5%;transform:rotate(10deg);}
  .s3{bottom:5%;left:6%;transform:rotate(8deg);width:42px;height:42px;font-size:20px;}
  .s4{bottom:5%;right:6%;transform:rotate(-9deg);width:42px;height:42px;font-size:20px;}
  @media (max-width:420px){
    .sticker{display:none;}

    .panel{
      padding:14px 8px 10px;
      border-width:4px;
      border-radius:23px;
    }

    .mode-toggle{
      top:-14px;
      left:10px;
      border-width:2px;
    }

    .mode-toggle button{
      font-size:13px;
      padding:3px 9px;
    }

    .row-toggle{
      top:-14px;
      right:10px;
      border-width:2px;
    }

    .row-toggle button{
      font-size:11px;
      padding:3px 7px;
    }

    .puzzle-box{
      --cell:clamp(44px, 15.2vw, 58px);
      --gap:4px;
    }

    .cell{
      border-width:2px;
      box-shadow:2px 2px 0 var(--ink);
      border-radius:9px;
    }

    .btn{
      font-size:11px;
      padding:7px 10px;
    }
  }

  @media (max-height:650px){
    .title{font-size:24px;}
    .subtitle-pill{font-size:11px;padding:4px 13px;margin-bottom:7px;}
    .panel{padding-top:12px;}
    .puzzle-box{--cell:clamp(40px, 13vw, 52px);}
    .btn-row{margin-top:7px;}
  }

  #flash{
    position:fixed;
    inset:0;
    background:var(--green);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
    z-index:50;
  }
  #flash.on{opacity:.4;}
  #flash.wrong{background:var(--red);}

  #confetti-canvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:60;
  }

  .scene{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:0;
    width:min(100%, 390px);
    max-width:390px;
    height:100%;
    max-height:100%;
  }

  .title{
    display:flex;
    justify-content:center;
    gap:1px;
    font-size:clamp(24px, 8vw, 32px);
    font-weight:800;
    margin:0 0 1px;
  }
  .title span{
    -webkit-text-stroke:3px var(--ink);
    paint-order:stroke fill;
  }

  .subtitle-pill{
    background:var(--ink);
    color:#fff;
    font-weight:700;
    font-size:13px;
    padding:6px 18px;
    border-radius:999px;
    transform:rotate(-3deg);
    margin:-2px 0 10px 0;
    box-shadow:0 3px 0 rgba(0,0,0,.3);
  }

  .panel{
    position:relative;
    background:var(--card);
    border:5px solid var(--ink);
    border-radius:26px;
    box-shadow:0 6px 0 var(--ink);
    padding:15px 10px 12px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* mode toggle: top-left */
  .mode-toggle{
    position:absolute;
    top:-16px;
    left:16px;
    display:flex;
    gap:2px;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:999px;
    padding:3px;
    box-shadow:0 3px 0 var(--ink);
  }
  .mode-toggle button{
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:15px;
    font-weight:800;
    padding:4px 11px;
    border-radius:999px;
    color:var(--ink);
    cursor:pointer;
  }
  .mode-toggle button.active{
    background:var(--orange);
    color:#fff;
  }

  /* row-count toggle: top-right (addition mode only) */
  .row-toggle{
    position:absolute;
    top:-16px;
    right:16px;
    display:flex;
    gap:2px;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:999px;
    padding:3px;
    box-shadow:0 3px 0 var(--ink);
  }
  .row-toggle button{
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:12px;
    font-weight:800;
    padding:4px 9px;
    border-radius:999px;
    color:var(--ink);
    cursor:pointer;
  }
  .row-toggle button.active{
    background:var(--purple);
    color:#fff;
  }
  .row-toggle.hidden{
    display:none;
  }

  /* fixed-size box: always sized for 6 rows (addition's max), regardless
     of currentRows or mode, so it never resizes on toggle */
  .puzzle-box{
    --cell: clamp(48px, 16vw, 62px);
    --gap: 5px;
    width:100%;
    height:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:5px;
  }

  .pyramid{
    display:flex;
    flex-direction:column;
    gap:var(--gap);
  }
  .row{
    display:flex;
    justify-content:center;
    gap:var(--gap);
  }

  /* cell frame matches the panel's style: thick black border + hard
     offset shadow (bottom-right) for a consistent 3D "sticker" feel */
  .cell{
    width:var(--cell);
    height:var(--cell);
    border-radius:11px;
    border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:calc(var(--cell) * 0.34);
    background:#fbfbff;
  }
  .cell.given{color:#fff;}
  .cell.given.c0{background:var(--green);}
  .cell.given.c1{background:var(--blue);}
  .cell.given.c2{background:var(--orange);}
  .cell.given.c3{background:var(--pink);}
  .cell.given.c4{background:var(--purple);}

  .cell input{
    width:100%;
    height:100%;
    text-align:center;
    font-size:calc(var(--cell) * 0.34);
    font-weight:800;
    font-family:inherit;
    color:var(--ink);
    background:transparent;
    border:none;
    -moz-appearance:textfield;
  }
  .cell input::-webkit-outer-spin-button,
  .cell input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .cell:has(input:focus){
    border-color:var(--purple);
  }
  .cell input:focus{
    outline:none;
  }

  .pyramid.shake{
    animation:shake .4s ease;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(7px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(4px);}
  }

  .btn-row{
    display:flex;
    gap:7px;
    margin-top:10px;
    flex-wrap:nowrap;
    justify-content:center;
    width:100%;
  }

  .btn{
    font-family:inherit;
    font-weight:800;
    font-size:12px;
    padding:8px 12px;
    border-radius:999px;
    border:2px solid var(--ink);
    cursor:pointer;
    box-shadow:0 3px 0 var(--ink);
    transition:transform .08s ease, box-shadow .08s ease;
    color:#fff;
    white-space:nowrap;
  }
  .btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 var(--ink);
  }
  .btn-check{background:var(--green);}
  .btn-new{background:#fff;color:var(--ink);}
</style>
</head>
<body>

<div class="sticker s1">🎈</div>
<div class="sticker s2">⭐</div>
<div class="sticker s3">🍩</div>
<div class="sticker s4">🎮</div>

<div id="flash"></div>
<canvas id="confetti-canvas"></canvas>

<div class="scene">
  <h1 class="title">
    <span style="color:var(--green)">P</span>
    <span style="color:var(--blue)">i</span>
    <span style="color:var(--orange)">r</span>
    <span style="color:var(--pink)">a</span>
    <span style="color:var(--purple)">m</span>
    <span style="color:var(--green)">i</span>
    <span style="color:var(--blue)">d</span>
    <span style="color:var(--orange)">a</span>
  </h1>
  <div class="subtitle-pill" id="subtitlePill">Zbrajanje</div>

  <div class="panel">
    <div class="mode-toggle">
      <button data-mode="add">+</button>
      <button data-mode="mul">✕</button>
    </div>

    <div class="row-toggle" id="rowToggle">
      <button data-rows="4">4</button>
      <button data-rows="5">5</button>
      <button data-rows="6">6</button>
    </div>

    <div class="puzzle-box">
      <div class="pyramid" id="pyramid"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-check" id="checkBtn">Provjeri odgovore</button>
      <button class="btn btn-new" id="newBtn">Nova igra</button>
    </div>
  </div>
</div>

<script>
const pyramidEl = document.getElementById('pyramid');
const newBtn = document.getElementById('newBtn');
const checkBtn = document.getElementById('checkBtn');
const flashEl = document.getElementById('flash');
const rowButtons = document.querySelectorAll('.row-toggle button');
const modeButtons = document.querySelectorAll('.mode-toggle button');
const rowToggleEl = document.getElementById('rowToggle');
const subtitlePill = document.getElementById('subtitlePill');

let currentMode = 'add';
let currentRows = 6;
let solution = [];
let hidden = [];
let inputs = [];
let busy = false;

function randInt(min, max){
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

/* ---------------- shared solvability check ---------------- */
// Checks whether the given reveal pattern lets every cell be deduced by
// repeatedly applying: parent = left OP right, or a child = parent
// (inverse OP) the other child, until nothing changes.
function isSolvable(revealed, sol, rows, op, inv){
  const known = [];
  for(let r = 0; r < rows; r++){
    known[r] = [];
    for(let i = 0; i <= r; i++){
      known[r][i] = revealed[r][i] ? sol[r][i] : null;
    }
  }

  let changed = true;
  while(changed){
    changed = false;
    for(let r = 0; r < rows - 1; r++){
      for(let i = 0; i <= r; i++){
        const p = known[r][i];
        const l = known[r + 1][i];
        const rt = known[r + 1][i + 1];
        const knownCount = (p !== null ? 1 : 0) + (l !== null ? 1 : 0) + (rt !== null ? 1 : 0);
        if(knownCount === 2){
          if(p === null){ known[r][i] = op(l, rt); changed = true; }
          else if(l === null){ known[r + 1][i] = inv(p, rt); changed = true; }
          else if(rt === null){ known[r + 1][i + 1] = inv(p, l); changed = true; }
        }
      }
    }
  }

  for(let r = 0; r < rows; r++){
    for(let i = 0; i <= r; i++){
      if(known[r][i] === null) return false;
    }
  }
  return true;
}

/* ---------------- ADDITION mode ---------------- */
// Top value is guaranteed <= 100: top = sum of C(rows-1, i) * bottom[i],
// and the total of those coefficients is 2^(rows-1), so capping each
// bottom cell at floor(100 / 2^(rows-1)) guarantees the worst case stays <= 100.
function addBottomCap(rows){
  return Math.max(1, Math.floor(100 / Math.pow(2, rows - 1)));
}

function buildAddSolution(rows){
  const cap = addBottomCap(rows);
  const sol = [];
  const bottom = [];
  for(let i = 0; i < rows; i++) bottom.push(randInt(1, cap));
  sol[rows - 1] = bottom;

  for(let r = rows - 2; r >= 0; r--){
    const row = [];
    const below = sol[r + 1];
    for(let i = 0; i <= r; i++){
      row.push(below[i] + below[i + 1]);
    }
    sol[r] = row;
  }
  return sol;
}

// Starts with every cell hidden (top included) and reveals random cells,
// one at a time, only as needed until the puzzle becomes fully solvable —
// this keeps the number of clues as close to the minimum as possible.
// The top cell has no special treatment: it may or may not end up revealed.
function buildAddReveal(rows, sol){
  const revealed = [];
  for(let r = 0; r < rows; r++){
    revealed[r] = new Array(r + 1).fill(false);
  }

  const addOp = (a, b) => a + b;
  const addInv = (a, b) => a - b;

  while(!isSolvable(revealed, sol, rows, addOp, addInv)){
    const hiddenCells = [];
    for(let r = 0; r < rows; r++){
      for(let i = 0; i <= r; i++){
        if(!revealed[r][i]) hiddenCells.push([r, i]);
      }
    }
    if(hiddenCells.length === 0) break;
    const [r, i] = hiddenCells[randInt(0, hiddenCells.length - 1)];
    revealed[r][i] = true;
  }

  return revealed;
}

/* ---------------- MULTIPLICATION mode (kids) ---------------- */
/*
 * Kid-friendly 4-row multiplication:
 * - bottom factors are small: 1, 2, 3, 4, 5, 10
 * - every number that can be entered is <= 100
 * - numbers are intentionally biased toward friendly results such as
 *   4, 5, 10, 12, 15, 16, 20, 25 and 50
 * - each generated pyramid is checked before being used
 */
const MUL_FACTORS = [1, 2, 3, 4, 5, 10];

function buildMulSolution(){
  const candidates = [];

  // Generate many possible small-factor pyramids and keep only those
  // whose entire pyramid stays <= 100.
  for(let a of MUL_FACTORS){
    for(let b of MUL_FACTORS){
      for(let c of MUL_FACTORS){
        for(let d of MUL_FACTORS){
          const bottom = [a,b,c,d];
          const row2 = [
            bottom[0] * bottom[1],
            bottom[1] * bottom[2],
            bottom[2] * bottom[3]
          ];
          const row1 = [
            row2[0] * row2[1],
            row2[1] * row2[2]
          ];
          const top = row1[0] * row1[1];

          const all = [...bottom, ...row2, ...row1, top];

          if(Math.max(...all) <= 100){
            candidates.push([top, row1, row2, bottom]);
          }
        }
      }
    }
  }

  // Prefer pyramids containing useful "school maths" numbers.
  // This makes 12/15/16/20/25/50 etc. appear much more often than
  // arbitrary results.
  const preferred = candidates.filter(sol => {
    const all = sol.flat();
    return all.some(n => [12,15,16,20,25,50].includes(n));
  });

  const pool = preferred.length ? preferred : candidates;
  return pool[randInt(0, pool.length - 1)];
}

function buildMulReveal(sol){
  const rows = 4;
  const revealed = [];
  for(let r = 0; r < rows; r++){
    revealed[r] = new Array(r + 1).fill(false);
  }

  const mulOp = (a, b) => a * b;
  const mulInv = (a, b) => a / b;

  // Reveal enough clues for the child to solve the whole pyramid,
  // while keeping most of the work as input.
  while(!isSolvable(revealed, sol, rows, mulOp, mulInv)){
    const hiddenCells = [];
    for(let r = 0; r < rows; r++){
      for(let i = 0; i <= r; i++){
        if(!revealed[r][i]) hiddenCells.push([r, i]);
      }
    }
    if(hiddenCells.length === 0) break;

    // Prefer revealing a small bottom number as a clue.
    const bottomHidden = hiddenCells.filter(([r]) => r === rows - 1);
    const pool = bottomHidden.length && Math.random() < 0.65
      ? bottomHidden
      : hiddenCells;

    const [r, i] = pool[randInt(0, pool.length - 1)];
    revealed[r][i] = true;
  }

  return revealed;
}

/* ---------------- generation / rendering ---------------- */
function generatePuzzle(mode, rows){
  currentMode = mode;

  if(mode === 'add'){
    currentRows = rows;
    solution = buildAddSolution(rows);
    const revealed = buildAddReveal(rows, solution);
    hidden = revealed.map(row => row.map(v => !v));
  } else {
    currentRows = 4;
    solution = buildMulSolution();
    const revealed = buildMulReveal(solution);
    hidden = revealed.map(row => row.map(v => !v));
  }
}

const giveColors = ['c0', 'c1', 'c2', 'c3', 'c4'];

function renderPyramid(){
  pyramidEl.innerHTML = '';
  inputs = [];
  busy = false;
  let colorIdx = 0;

  for(let r = 0; r < currentRows; r++){
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    inputs[r] = [];

    for(let i = 0; i <= r; i++){
      const cellEl = document.createElement('div');

      if(hidden[r][i]){
        cellEl.className = 'cell';
        const input = document.createElement('input');
        input.type = 'text';
        input.inputMode = 'numeric';
        input.maxLength = 3;
        input.addEventListener('input', () => {
          input.value = input.value.replace(/[^0-9]/g, '');
          if(input.value !== '' && Number(input.value) > 100){
            input.value = '100';
          }
        });
        cellEl.appendChild(input);
        inputs[r][i] = input;
      } else {
        cellEl.className = 'cell given ' + giveColors[colorIdx % giveColors.length];
        colorIdx++;
        cellEl.textContent = solution[r][i];
        inputs[r][i] = null;
      }

      rowEl.appendChild(cellEl);
    }

    pyramidEl.appendChild(rowEl);
  }
}

function handleCheck(){
  if(busy) return;

  let allFilled = true;
  for(let r = 0; r < currentRows; r++){
    for(let i = 0; i <= r; i++){
      const input = inputs[r][i];
      if(input && input.value.trim() === ''){
        allFilled = false;
      }
    }
  }

  if(!allFilled){
    pyramidEl.classList.remove('shake');
    void pyramidEl.offsetWidth;
    pyramidEl.classList.add('shake');
    return;
  }

  let allCorrect = true;
  for(let r = 0; r < currentRows; r++){
    for(let i = 0; i <= r; i++){
      const input = inputs[r][i];
      if(input && parseInt(input.value, 10) !== solution[r][i]){
        allCorrect = false;
      }
    }
  }

  if(allCorrect){
    busy = true;
    flash(false);
    launchConfetti();
    setTimeout(() => startPuzzle(currentMode, currentRows), 900);
  } else {
    flash(true);
  }
}

function flash(isWrong){
  flashEl.classList.toggle('wrong', isWrong);
  flashEl.classList.add('on');
  setTimeout(() => flashEl.classList.remove('on'), 500);
}

function startPuzzle(mode, rows){
  generatePuzzle(mode, rows);
  renderPyramid();
  setActiveModeButton(mode);
  setActiveRowButton(rows);
  rowToggleEl.classList.toggle('hidden', mode !== 'add');
  subtitlePill.textContent = mode === 'add' ? 'Zbrajanje' : 'Množenje ✕';
}

function setActiveModeButton(mode){
  modeButtons.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
}

function setActiveRowButton(rows){
  rowButtons.forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.rows, 10) === rows);
  });
}

newBtn.addEventListener('click', () => startPuzzle(currentMode, currentRows));
checkBtn.addEventListener('click', handleCheck);
rowButtons.forEach(btn => {
  btn.addEventListener('click', () => startPuzzle('add', parseInt(btn.dataset.rows, 10)));
});
modeButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.mode;
    const rows = mode === 'add' ? (currentMode === 'add' ? currentRows : 6) : 4;
    startPuzzle(mode, rows);
  });
});

startPuzzle(currentMode, currentRows);

/* ---- confetti ---- */
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let confettiRunning = false;

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const confettiColors = ['#3ddc84', '#4fc3f7', '#ffa94d', '#ff7aa8', '#b388ff', '#ffd83d'];

function launchConfetti(){
  particles = [];
  const count = 180;
  for(let i = 0; i < count; i++){
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 15,
      vy: (Math.random() - 1.6) * 15,
      size: randInt(5, 10),
      color: confettiColors[randInt(0, confettiColors.length - 1)],
      rotation: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.3,
      life: 0
    });
  }
  if(!confettiRunning){
    confettiRunning = true;
    requestAnimationFrame(animateConfetti);
  }
}

function animateConfetti(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let stillAlive = false;

  for(const p of particles){
    p.vy += 0.35;
    p.x += p.vx;
    p.y += p.vy;
    p.rotation += p.spin;
    p.life++;

    if(p.y < canvas.height + 20 && p.life < 220){
      stillAlive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    }
  }

  if(stillAlive){
    requestAnimationFrame(animateConfetti);
  } else {
    confettiRunning = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}
</script>
