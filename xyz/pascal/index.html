<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piramida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a;
    --muted:#9a97a3;

    --panel:#e8f2ff;
    --card:#ffffff;

    --clue:#ff8a5c;
    --clue-text:#ffffff;

    --green:#3ecf7e;
    --red:#ff6b6b;

    --border:#e3e2ea;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    color:var(--ink);
    font-family:'Baloo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  #flash{
    position:fixed;
    inset:0;
    background:var(--green);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
    z-index:50;
  }
  #flash.on{opacity:.35;}
  #flash.wrong{background:var(--red);}

  #confetti-canvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:60;
  }

  .panel{
    position:relative;
    background:var(--panel);
    border-radius:32px;
    padding:20px 26px 26px;
    box-shadow:0 20px 40px rgba(26,26,26,0.08);
  }

  /* tiny, unobtrusive row-count toggle */
  .row-toggle{
    position:absolute;
    top:16px;
    right:16px;
    display:flex;
    gap:2px;
    background:rgba(255,255,255,0.7);
    border-radius:999px;
    padding:3px;
  }
  .row-toggle button{
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    padding:5px 9px;
    border-radius:999px;
    color:var(--muted);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .row-toggle button.active{
    background:var(--ink);
    color:#fff;
  }

  .main{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  .title{
    margin:6px 0 0 0;
    font-size:26px;
    font-weight:800;
    color:var(--ink);
  }

  .card{
    background:var(--card);
    border-radius:24px;
    padding:18px;
  }

  .pyramid{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .row{
    display:flex;
    justify-content:center;
    gap:8px;
  }
  .cell{
    width:50px;
    height:50px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:800;
  }
  .cell.given{
    background:var(--clue);
    color:var(--clue-text);
    box-shadow:0 4px 10px rgba(255,138,92,0.35);
  }

  .cell input{
    width:100%;
    height:100%;
    text-align:center;
    font-size:18px;
    font-weight:800;
    font-family:inherit;
    color:var(--ink);
    background:#fafafe;
    border:2px solid var(--border);
    border-radius:14px;
    transition:border-color .12s ease, background .12s ease;
    -moz-appearance:textfield;
  }
  .cell input::-webkit-outer-spin-button,
  .cell input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .cell input:focus{
    outline:none;
    background:#fff;
    border-color:var(--ink);
  }

  .pyramid.shake{
    animation:shake .4s ease;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(7px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(4px);}
  }

  .btn-row{
    display:flex;
    gap:10px;
    margin-top:2px;
  }

  .btn{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    padding:12px 20px;
    border-radius:999px;
    cursor:pointer;
    border:none;
    transition:transform .1s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(.96);}

  .btn-check{
    background:var(--ink);
    color:#fff;
  }
  .btn-check:hover{opacity:.88;}

  .btn-new{
    background:#fff;
    color:var(--ink);
    border:2px solid var(--border);
  }
  .btn-new:hover{background:#f5f5fa;}

  @media (max-width:560px){
    .panel{padding:16px 14px 20px;border-radius:26px;}
    .card{padding:12px;border-radius:18px;}
    .cell{width:38px;height:38px;font-size:14px;border-radius:10px;}
    .cell input{font-size:14px;border-radius:10px;border-width:1.5px;}
    .row{gap:5px;}
    .pyramid{gap:5px;}
    .btn{padding:10px 16px;font-size:13px;}
    .title{font-size:21px;}
  }
</style>
</head>
<body>

<div id="flash"></div>
<canvas id="confetti-canvas"></canvas>

<div class="panel">
  <div class="row-toggle">
    <button data-rows="4">4</button>
    <button data-rows="5">5</button>
    <button data-rows="6">6</button>
  </div>

  <div class="main">
    <h1 class="title">Piramida</h1>
    <div class="card">
      <div class="pyramid" id="pyramid"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-check" id="checkBtn">Provjeri odgovore</button>
      <button class="btn btn-new" id="newBtn">Nova igra</button>
    </div>
  </div>
</div>

<script>
const pyramidEl = document.getElementById('pyramid');
const newBtn = document.getElementById('newBtn');
const checkBtn = document.getElementById('checkBtn');
const flashEl = document.getElementById('flash');
const rowButtons = document.querySelectorAll('.row-toggle button');

let currentRows = 6;
let solution = [];
let hidden = [];
let inputs = [];
let busy = false;

function randInt(min, max){
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// Top value is guaranteed <= 100: top = sum of C(rows-1, i) * bottom[i],
// and the total of those coefficients is 2^(rows-1), so capping each
// bottom cell at floor(100 / 2^(rows-1)) guarantees the worst case stays <= 100.
function bottomCap(rows){
  return Math.max(1, Math.floor(100 / Math.pow(2, rows - 1)));
}

function buildSolution(rows){
  const cap = bottomCap(rows);
  const sol = [];
  const bottom = [];
  for(let i = 0; i < rows; i++) bottom.push(randInt(1, cap));
  sol[rows - 1] = bottom;

  for(let r = rows - 2; r >= 0; r--){
    const row = [];
    const below = sol[r + 1];
    for(let i = 0; i <= r; i++){
      row.push(below[i] + below[i + 1]);
    }
    sol[r] = row;
  }
  return sol;
}

// Checks whether the given reveal pattern lets every cell be deduced
// using addition (parent = left + right) or subtraction (a child =
// parent - the other child), applied repeatedly until nothing changes.
function isSolvable(revealed, sol, rows){
  const known = [];
  for(let r = 0; r < rows; r++){
    known[r] = [];
    for(let i = 0; i <= r; i++){
      known[r][i] = revealed[r][i] ? sol[r][i] : null;
    }
  }

  let changed = true;
  while(changed){
    changed = false;
    for(let r = 0; r < rows - 1; r++){
      for(let i = 0; i <= r; i++){
        const p = known[r][i];
        const l = known[r + 1][i];
        const rt = known[r + 1][i + 1];
        const knownCount = (p !== null ? 1 : 0) + (l !== null ? 1 : 0) + (rt !== null ? 1 : 0);
        if(knownCount === 2){
          if(p === null){ known[r][i] = l + rt; changed = true; }
          else if(l === null){ known[r + 1][i] = p - rt; changed = true; }
          else if(rt === null){ known[r + 1][i + 1] = p - l; changed = true; }
        }
      }
    }
  }

  for(let r = 0; r < rows; r++){
    for(let i = 0; i <= r; i++){
      if(known[r][i] === null) return false;
    }
  }
  return true;
}

// Scatters revealed ("given") cells across the whole triangle, then
// tops up random extra reveals until the puzzle is fully solvable.
// The top cell is always the hidden goal.
function buildReveal(rows, sol){
  const revealed = [];
  for(let r = 0; r < rows; r++){
    const row = [];
    for(let i = 0; i <= r; i++){
      if(r === 0 && i === 0){
        row.push(false);
      } else {
        row.push(Math.random() < 0.35);
      }
    }
    revealed[r] = row;
  }

  while(!isSolvable(revealed, sol, rows)){
    const hiddenCells = [];
    for(let r = 0; r < rows; r++){
      for(let i = 0; i <= r; i++){
        if(!revealed[r][i] && !(r === 0 && i === 0)){
          hiddenCells.push([r, i]);
        }
      }
    }
    if(hiddenCells.length === 0) break;
    const [r, i] = hiddenCells[randInt(0, hiddenCells.length - 1)];
    revealed[r][i] = true;
  }

  return revealed;
}

function generatePuzzle(rows){
  currentRows = rows;
  solution = buildSolution(rows);
  const revealed = buildReveal(rows, solution);

  hidden = [];
  for(let r = 0; r < rows; r++){
    hidden[r] = [];
    for(let i = 0; i <= r; i++){
      hidden[r][i] = !revealed[r][i];
    }
  }
}

function renderPyramid(){
  pyramidEl.innerHTML = '';
  inputs = [];
  busy = false;

  for(let r = 0; r < currentRows; r++){
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    inputs[r] = [];

    for(let i = 0; i <= r; i++){
      const cellEl = document.createElement('div');

      if(hidden[r][i]){
        cellEl.className = 'cell';
        const input = document.createElement('input');
        input.type = 'text';
        input.inputMode = 'numeric';
        input.maxLength = 3;
        input.addEventListener('input', () => {
          input.value = input.value.replace(/[^0-9]/g, '');
        });
        cellEl.appendChild(input);
        inputs[r][i] = input;
      } else {
        cellEl.className = 'cell given';
        cellEl.textContent = solution[r][i];
        inputs[r][i] = null;
      }

      rowEl.appendChild(cellEl);
    }

    pyramidEl.appendChild(rowEl);
  }
}

function handleCheck(){
  if(busy) return;

  let allFilled = true;
  for(let r = 0; r < currentRows; r++){
    for(let i = 0; i <= r; i++){
      const input = inputs[r][i];
      if(input && input.value.trim() === ''){
        allFilled = false;
      }
    }
  }

  if(!allFilled){
    pyramidEl.classList.remove('shake');
    void pyramidEl.offsetWidth;
    pyramidEl.classList.add('shake');
    return;
  }

  let allCorrect = true;
  for(let r = 0; r < currentRows; r++){
    for(let i = 0; i <= r; i++){
      const input = inputs[r][i];
      if(input && parseInt(input.value, 10) !== solution[r][i]){
        allCorrect = false;
      }
    }
  }

  if(allCorrect){
    busy = true;
    flash(false);
    launchConfetti();
    setTimeout(() => startPuzzle(currentRows), 900);
  } else {
    flash(true);
  }
}

function flash(isWrong){
  flashEl.classList.toggle('wrong', isWrong);
  flashEl.classList.add('on');
  setTimeout(() => flashEl.classList.remove('on'), 500);
}

function startPuzzle(rows){
  generatePuzzle(rows);
  renderPyramid();
  setActiveRowButton(rows);
}

function setActiveRowButton(rows){
  rowButtons.forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.rows, 10) === rows);
  });
}

newBtn.addEventListener('click', () => startPuzzle(currentRows));
checkBtn.addEventListener('click', handleCheck);
rowButtons.forEach(btn => {
  btn.addEventListener('click', () => startPuzzle(parseInt(btn.dataset.rows, 10)));
});

startPuzzle(currentRows);

/* ---- confetti ---- */
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let confettiRunning = false;

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const confettiColors = ['#ff8a5c', '#3ecf7e', '#4fa8f7', '#ffd93d', '#1a1a1a'];

function launchConfetti(){
  particles = [];
  const count = 180;
  for(let i = 0; i < count; i++){
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 15,
      vy: (Math.random() - 1.6) * 15,
      size: randInt(5, 10),
      color: confettiColors[randInt(0, confettiColors.length - 1)],
      rotation: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.3,
      life: 0
    });
  }
  if(!confettiRunning){
    confettiRunning = true;
    requestAnimationFrame(animateConfetti);
  }
}

function animateConfetti(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let stillAlive = false;

  for(const p of particles){
    p.vy += 0.35;
    p.x += p.vx;
    p.y += p.vy;
    p.rotation += p.spin;
    p.life++;

    if(p.y < canvas.height + 20 && p.life < 220){
      stillAlive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    }
  }

  if(stillAlive){
    requestAnimationFrame(animateConfetti);
  } else {
    confettiRunning = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}
</script>

</body>
</html>
