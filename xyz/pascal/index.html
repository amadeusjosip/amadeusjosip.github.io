<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piramida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a;
    --bg-yellow:#ffd83d;
    --card:#ffffff;

    --green:#3ddc84;
    --blue:#4fc3f7;
    --orange:#ffa94d;
    --pink:#ff7aa8;
    --purple:#b388ff;
    --red:#ff5f5f;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    font-family:'Baloo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:var(--bg-yellow);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px 14px;
  }

  .sticker{
    position:fixed;
    width:50px;
    height:50px;
    background:#fff;
    border:4px solid var(--ink);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    box-shadow:0 4px 0 var(--ink);
    z-index:0;
  }
  .s1{top:5%;left:5%;transform:rotate(-12deg);}
  .s2{top:5%;right:5%;transform:rotate(10deg);}
  .s3{bottom:5%;left:6%;transform:rotate(8deg);width:42px;height:42px;font-size:20px;}
  .s4{bottom:5%;right:6%;transform:rotate(-9deg);width:42px;height:42px;font-size:20px;}
  @media (max-width:420px){
    .sticker{display:none;}
  }

  #flash{
    position:fixed;
    inset:0;
    background:var(--green);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
    z-index:50;
  }
  #flash.on{opacity:.4;}
  #flash.wrong{background:var(--red);}

  #confetti-canvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:60;
  }

  .scene{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    width:100%;
    max-width:360px;
  }

  .title{
    display:flex;
    justify-content:center;
    gap:1px;
    font-size:clamp(28px, 8.5vw, 36px);
    font-weight:800;
    margin:0;
  }
  .title span{
    -webkit-text-stroke:3px var(--ink);
    paint-order:stroke fill;
  }

  .subtitle-pill{
    background:var(--ink);
    color:#fff;
    font-weight:700;
    font-size:13px;
    padding:6px 18px;
    border-radius:999px;
    transform:rotate(-3deg);
    margin:-2px 0 14px 0;
    box-shadow:0 3px 0 rgba(0,0,0,.3);
  }

  .panel{
    position:relative;
    background:var(--card);
    border:5px solid var(--ink);
    border-radius:30px;
    box-shadow:0 8px 0 var(--ink);
    padding:20px 16px 20px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .row-toggle{
    position:absolute;
    top:-16px;
    right:16px;
    display:flex;
    gap:2px;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:999px;
    padding:3px;
    box-shadow:0 3px 0 var(--ink);
  }
  .row-toggle button{
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:12px;
    font-weight:800;
    padding:4px 9px;
    border-radius:999px;
    color:var(--ink);
    cursor:pointer;
  }
  .row-toggle button.active{
    background:var(--purple);
    color:#fff;
  }

  /* fixed-size box: always sized for 6 rows, regardless of currentRows */
  .puzzle-box{
    --cell: clamp(30px, 9.5vw, 44px);
    --gap: 6px;
    width: calc(var(--cell) * 6 + var(--gap) * 5);
    height: calc(var(--cell) * 6 + var(--gap) * 5);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:8px;
  }

  .pyramid{
    display:flex;
    flex-direction:column;
    gap:var(--gap);
  }
  .row{
    display:flex;
    justify-content:center;
    gap:var(--gap);
  }
  .cell{
    width:var(--cell);
    height:var(--cell);
    border-radius:12px;
    border:3px solid var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:calc(var(--cell) * 0.36);
  }
  .cell.given{
    color:#fff;
    box-shadow:0 3px 0 var(--ink);
  }
  .cell.given.c0{background:var(--green);}
  .cell.given.c1{background:var(--blue);}
  .cell.given.c2{background:var(--orange);}
  .cell.given.c3{background:var(--pink);}
  .cell.given.c4{background:var(--purple);}

  .cell input{
    width:100%;
    height:100%;
    text-align:center;
    font-size:calc(var(--cell) * 0.36);
    font-weight:800;
    font-family:inherit;
    color:var(--ink);
    background:#fbfbff;
    border:3px solid var(--ink);
    border-radius:12px;
    transition:background .12s ease, border-color .12s ease;
    -moz-appearance:textfield;
  }
  .cell input::-webkit-outer-spin-button,
  .cell input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .cell input:focus{
    outline:none;
    background:#fff;
    border-color:var(--purple);
  }

  .pyramid.shake{
    animation:shake .4s ease;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(7px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(4px);}
  }

  .btn-row{
    display:flex;
    gap:10px;
    margin-top:16px;
    flex-wrap:wrap;
    justify-content:center;
  }

  .btn{
    font-family:inherit;
    font-weight:800;
    font-size:14px;
    padding:12px 20px;
    border-radius:999px;
    border:3px solid var(--ink);
    cursor:pointer;
    box-shadow:0 4px 0 var(--ink);
    transition:transform .08s ease, box-shadow .08s ease;
    color:#fff;
  }
  .btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 var(--ink);
  }
  .btn-check{background:var(--green);}
  .btn-new{background:var(--pink);}
</style>
</head>
<body>

<div class="sticker s1">🎈</div>
<div class="sticker s2">⭐</div>
<div class="sticker s3">🍩</div>
<div class="sticker s4">🎮</div>

<div id="flash"></div>
<canvas id="confetti-canvas"></canvas>

<div class="scene">
  <h1 class="title">
    <span style="color:var(--green)">P</span>
    <span style="color:var(--blue)">i</span>
    <span style="color:var(--orange)">r</span>
    <span style="color:var(--pink)">a</span>
    <span style="color:var(--purple)">m</span>
    <span style="color:var(--green)">i</span>
    <span style="color:var(--blue)">d</span>
    <span style="color:var(--orange)">a</span>
  </h1>
  <div class="subtitle-pill">Zbrajanje</div>

  <div class="panel">
    <div class="row-toggle">
      <button data-rows="4">4</button>
      <button data-rows="5">5</button>
      <button data-rows="6">6</button>
    </div>

    <div class="puzzle-box">
      <div class="pyramid" id="pyramid"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-check" id="checkBtn">Provjeri odgovore</button>
      <button class="btn btn-new" id="newBtn">Nova igra</button>
    </div>
  </div>
</div>

<script>
const pyramidEl = document.getElementById('pyramid');
const newBtn = document.getElementById('newBtn');
const checkBtn = document.getElementById('checkBtn');
const flashEl = document.getElementById('flash');
const rowButtons = document.querySelectorAll('.row-toggle button');

let currentRows = 6;
let solution = [];
let hidden = [];
let inputs = [];
let busy = false;

function randInt(min, max){
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// Top value is guaranteed <= 100: top = sum of C(rows-1, i) * bottom[i],
// and the total of those coefficients is 2^(rows-1), so capping each
// bottom cell at floor(100 / 2^(rows-1)) guarantees the worst case stays <= 100.
function bottomCap(rows){
  return Math.max(1, Math.floor(100 / Math.pow(2, rows - 1)));
}

function buildSolution(rows){
  const cap = bottomCap(rows);
  const sol = [];
  const bottom = [];
  for(let i = 0; i < rows; i++) bottom.push(randInt(1, cap));
  sol[rows - 1] = bottom;

  for(let r = rows - 2; r >= 0; r--){
    const row = [];
    const below = sol[r + 1];
    for(let i = 0; i <= r; i++){
      row.push(below[i] + below[i + 1]);
    }
    sol[r] = row;
  }
  return sol;
}

// Checks whether the given reveal pattern lets every cell be deduced
// using addition (parent = left + right) or subtraction (a child =
// parent - the other child), applied repeatedly until nothing changes.
function isSolvable(revealed, sol, rows){
  const known = [];
  for(let r = 0; r < rows; r++){
    known[r] = [];
    for(let i = 0; i <= r; i++){
      known[r][i] = revealed[r][i] ? sol[r][i] : null;
    }
  }

  let changed = true;
  while(changed){
    changed = false;
    for(let r = 0; r < rows - 1; r++){
      for(let i = 0; i <= r; i++){
        const p = known[r][i];
        const l = known[r + 1][i];
        const rt = known[r + 1][i + 1];
        const knownCount = (p !== null ? 1 : 0) + (l !== null ? 1 : 0) + (rt !== null ? 1 : 0);
        if(knownCount === 2){
          if(p === null){ known[r][i] = l + rt; changed = true; }
          else if(l === null){ known[r + 1][i] = p - rt; changed = true; }
          else if(rt === null){ known[r + 1][i + 1] = p - l; changed = true; }
        }
      }
    }
  }

  for(let r = 0; r < rows; r++){
    for(let i = 0; i <= r; i++){
      if(known[r][i] === null) return false;
    }
  }
  return true;
}

// Scatters revealed ("given") cells across the whole triangle, then
// tops up random extra reveals until the puzzle is fully solvable.
// The top cell is always the hidden goal.
function buildReveal(rows, sol){
  const revealed = [];
  for(let r = 0; r < rows; r++){
    const row = [];
    for(let i = 0; i <= r; i++){
      if(r === 0 && i === 0){
        row.push(false);
      } else {
        row.push(Math.random() < 0.35);
      }
    }
    revealed[r] = row;
  }

  while(!isSolvable(revealed, sol, rows)){
    const hiddenCells = [];
    for(let r = 0; r < rows; r++){
      for(let i = 0; i <= r; i++){
        if(!revealed[r][i] && !(r === 0 && i === 0)){
          hiddenCells.push([r, i]);
        }
      }
    }
    if(hiddenCells.length === 0) break;
    const [r, i] = hiddenCells[randInt(0, hiddenCells.length - 1)];
    revealed[r][i] = true;
  }

  return revealed;
}

function generatePuzzle(rows){
  currentRows = rows;
  solution = buildSolution(rows);
  const revealed = buildReveal(rows, solution);

  hidden = [];
  for(let r = 0; r < rows; r++){
    hidden[r] = [];
    for(let i = 0; i <= r; i++){
      hidden[r][i] = !revealed[r][i];
    }
  }
}

const giveColors = ['c0', 'c1', 'c2', 'c3', 'c4'];

function renderPyramid(){
  pyramidEl.innerHTML = '';
  inputs = [];
  busy = false;
  let colorIdx = 0;

  for(let r = 0; r < currentRows; r++){
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    inputs[r] = [];

    for(let i = 0; i <= r; i++){
      const cellEl = document.createElement('div');

      if(hidden[r][i]){
        cellEl.className = 'cell';
        const input = document.createElement('input');
        input.type = 'text';
        input.inputMode = 'numeric';
        input.maxLength = 3;
        input.addEventListener('input', () => {
          input.value = input.value.replace(/[^0-9]/g, '');
        });
        cellEl.appendChild(input);
        inputs[r][i] = input;
      } else {
        cellEl.className = 'cell given ' + giveColors[colorIdx % giveColors.length];
        colorIdx++;
        cellEl.textContent = solution[r][i];
        inputs[r][i] = null;
      }

      rowEl.appendChild(cellEl);
    }

    pyramidEl.appendChild(rowEl);
  }
}

function handleCheck(){
  if(busy) return;

  let allFilled = true;
  for(let r = 0; r < currentRows; r++){
    for(let i = 0; i <= r; i++){
      const input = inputs[r][i];
      if(input && input.value.trim() === ''){
        allFilled = false;
      }
    }
  }

  if(!allFilled){
    pyramidEl.classList.remove('shake');
    void pyramidEl.offsetWidth;
    pyramidEl.classList.add('shake');
    return;
  }

  let allCorrect = true;
  for(let r = 0; r < currentRows; r++){
    for(let i = 0; i <= r; i++){
      const input = inputs[r][i];
      if(input && parseInt(input.value, 10) !== solution[r][i]){
        allCorrect = false;
      }
    }
  }

  if(allCorrect){
    busy = true;
    flash(false);
    launchConfetti();
    setTimeout(() => startPuzzle(currentRows), 900);
  } else {
    flash(true);
  }
}

function flash(isWrong){
  flashEl.classList.toggle('wrong', isWrong);
  flashEl.classList.add('on');
  setTimeout(() => flashEl.classList.remove('on'), 500);
}

function startPuzzle(rows){
  generatePuzzle(rows);
  renderPyramid();
  setActiveRowButton(rows);
}

function setActiveRowButton(rows){
  rowButtons.forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.rows, 10) === rows);
  });
}

newBtn.addEventListener('click', () => startPuzzle(currentRows));
checkBtn.addEventListener('click', handleCheck);
rowButtons.forEach(btn => {
  btn.addEventListener('click', () => startPuzzle(parseInt(btn.dataset.rows, 10)));
});

startPuzzle(currentRows);

/* ---- confetti ---- */
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let confettiRunning = false;

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const confettiColors = ['#3ddc84', '#4fc3f7', '#ffa94d', '#ff7aa8', '#b388ff', '#ffd83d'];

function launchConfetti(){
  particles = [];
  const count = 180;
  for(let i = 0; i < count; i++){
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 15,
      vy: (Math.random() - 1.6) * 15,
      size: randInt(5, 10),
      color: confettiColors[randInt(0, confettiColors.length - 1)],
      rotation: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.3,
      life: 0
    });
  }
  if(!confettiRunning){
    confettiRunning = true;
    requestAnimationFrame(animateConfetti);
  }
}

function animateConfetti(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let stillAlive = false;

  for(const p of particles){
    p.vy += 0.35;
    p.x += p.vx;
    p.y += p.vy;
    p.rotation += p.spin;
    p.life++;

    if(p.y < canvas.height + 20 && p.life < 220){
      stillAlive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    }
  }

  if(stillAlive){
    requestAnimationFrame(animateConfetti);
  } else {
    confettiRunning = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}
</script>

</body>
</html>
