<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piramida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#221f2e;

    --green:#3ddc84;
    --green-dark:#1fa863;
    --blue:#4fc3f7;
    --blue-dark:#1f9cd9;
    --orange:#ffa94d;
    --orange-dark:#e8841f;
    --pink:#ff7aa8;
    --pink-dark:#e8547f;
    --red:#ff5f5f;
    --red-dark:#e63e3e;
    --yellow:#ffd93d;
    --yellow-dark:#eab308;
    --purple:#b388ff;
    --purple-dark:#9163e8;

    --panel:#ffffff;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    color:var(--ink);
    font-family:'Baloo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(circle at 15% 20%, #fff3c4 0%, transparent 38%),
      radial-gradient(circle at 85% 15%, #cdeeff 0%, transparent 38%),
      radial-gradient(circle at 88% 85%, #ffd9e8 0%, transparent 40%),
      radial-gradient(circle at 10% 88%, #d6f5e0 0%, transparent 40%),
      #eef0fb;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* decorative stickers floating in the background */
  .sticker{
    position:fixed;
    font-size:44px;
    opacity:.7;
    z-index:0;
    filter:drop-shadow(0 3px 0 rgba(34,31,46,.12));
  }
  .s1{top:6%;left:6%;transform:rotate(-14deg);}
  .s2{bottom:8%;left:8%;transform:rotate(10deg);font-size:38px;}
  .s3{top:8%;right:7%;transform:rotate(12deg);}
  .s4{bottom:6%;right:8%;transform:rotate(-10deg);font-size:38px;}

  #flash{
    position:fixed;
    inset:0;
    background:var(--green-dark);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
    z-index:50;
  }
  #flash.on{opacity:.4;}
  #flash.wrong{background:var(--red-dark);}

  #confetti-canvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:60;
  }

  .stage{
    position:relative;
    z-index:1;
    display:flex;
    align-items:flex-start;
    gap:26px;
    padding:24px;
  }

  .panel{
    background:var(--panel);
    border:5px solid var(--ink);
    border-radius:30px;
    box-shadow:8px 10px 0 var(--ink);
    padding:22px 22px 24px;
  }

  /* side panel */
  .side-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    margin-top:46px;
    background:var(--panel);
    border:5px solid var(--ink);
    border-radius:26px;
    box-shadow:6px 8px 0 var(--ink);
    padding:14px 10px;
  }
  .side-label{
    font-size:12px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.6;
    margin-bottom:2px;
  }
  .row-btn{
    width:46px;
    height:46px;
    border-radius:50%;
    border:4px solid var(--ink);
    background:var(--purple);
    color:#fff;
    font-family:inherit;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 4px 0 var(--ink);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .row-btn:hover{transform:translateY(-2px);}
  .row-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
  .row-btn.active{
    background:var(--pink);
    transform:scale(1.08);
  }

  /* main */
  .main{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }

  .title{
    display:flex;
    justify-content:center;
    gap:1px;
    margin:0 0 2px 0;
    font-size:32px;
    font-weight:800;
  }
  .title span{
    -webkit-text-stroke:3px var(--ink);
    paint-order:stroke fill;
  }

  .pyramid{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .row{
    display:flex;
    justify-content:center;
    gap:8px;
  }
  .cell{
    width:52px;
    height:52px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    font-weight:800;
    border:4px solid var(--ink);
  }
  .cell.given{
    color:#fff;
    box-shadow:0 3px 0 var(--ink);
    -webkit-text-stroke:1px var(--ink);
    paint-order:stroke fill;
  }
  .cell.given.c0{background:var(--green);}
  .cell.given.c1{background:var(--blue);}
  .cell.given.c2{background:var(--orange);}
  .cell.given.c3{background:var(--pink);}
  .cell.given.c4{background:var(--purple);}

  .cell input{
    width:100%;
    height:100%;
    text-align:center;
    font-size:19px;
    font-weight:800;
    font-family:inherit;
    color:var(--ink);
    background:#fffef7;
    border:4px solid var(--ink);
    border-radius:14px;
    box-shadow:0 3px 0 var(--ink);
    transition:box-shadow .1s ease, transform .1s ease, background .12s ease;
    -moz-appearance:textfield;
  }
  .cell input::-webkit-outer-spin-button,
  .cell input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .cell input:focus{
    outline:none;
    background:#fff;
    box-shadow:0 3px 0 var(--purple-dark);
  }

  .pyramid.shake{
    animation:shake .4s ease;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(7px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(4px);}
  }

  .btn-row{
    display:flex;
    gap:14px;
    margin-top:2px;
  }

  .btn{
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    padding:12px 20px;
    border:4px solid var(--ink);
    border-radius:16px;
    cursor:pointer;
    color:var(--ink);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .btn:active{transform:translateY(4px);}

  .btn-check{
    background:var(--green);
    box-shadow:0 5px 0 var(--ink);
  }
  .btn-check:active{box-shadow:0 1px 0 var(--ink);}

  .btn-new{
    background:var(--yellow);
    box-shadow:0 5px 0 var(--ink);
  }
  .btn-new:active{box-shadow:0 1px 0 var(--ink);}

  @media (max-width:560px){
    .stage{flex-direction:column;align-items:center;gap:16px;padding:14px;}
    .side-panel{flex-direction:row;margin-top:0;}
    .panel{padding:16px 14px 18px;border-radius:24px;}
    .cell{width:38px;height:38px;font-size:14px;border-radius:10px;border-width:3px;}
    .cell input{font-size:14px;border-radius:10px;border-width:3px;}
    .row{gap:5px;}
    .pyramid{gap:5px;}
    .btn{padding:10px 14px;font-size:13px;}
    .btn-row{flex-wrap:wrap;justify-content:center;}
    .title{font-size:24px;}
    .sticker{font-size:30px;}
  }
</style>
</head>
<body>

<div class="sticker s1">🌈</div>
<div class="sticker s2">⭐</div>
<div class="sticker s3">☁️</div>
<div class="sticker s4">🍙</div>

<div id="flash"></div>
<canvas id="confetti-canvas"></canvas>

<div class="stage">
  <div class="side-panel">
    <div class="side-label">Redci</div>
    <button class="row-btn" data-rows="4">4</button>
    <button class="row-btn" data-rows="5">5</button>
    <button class="row-btn" data-rows="6">6</button>
  </div>

  <div class="panel main">
    <h1 class="title">
      <span style="color:var(--green)">P</span>
      <span style="color:var(--blue)">i</span>
      <span style="color:var(--orange)">r</span>
      <span style="color:var(--pink)">a</span>
      <span style="color:var(--purple)">m</span>
      <span style="color:var(--green)">i</span>
      <span style="color:var(--blue)">d</span>
      <span style="color:var(--orange)">a</span>
    </h1>
    <div class="pyramid" id="pyramid"></div>
    <div class="btn-row">
      <button class="btn btn-check" id="checkBtn">Provjeri odgovore</button>
      <button class="btn btn-new" id="newBtn">Nova igra</button>
    </div>
  </div>
</div>

<script>
const pyramidEl = document.getElementById('pyramid');
const newBtn = document.getElementById('newBtn');
const checkBtn = document.getElementById('checkBtn');
const flashEl = document.getElementById('flash');
const rowButtons = document.querySelectorAll('.row-btn');

let currentRows = 6;
let solution = [];
let hidden = [];
let inputs = [];
let busy = false;

function randInt(min, max){
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// Top value is guaranteed <= 100: top = sum of C(rows-1, i) * bottom[i],
// and the total of those coefficients is 2^(rows-1), so capping each
// bottom cell at floor(100 / 2^(rows-1)) guarantees the worst case stays <= 100.
function bottomCap(rows){
  return Math.max(1, Math.floor(100 / Math.pow(2, rows - 1)));
}

function generatePuzzle(rows){
  currentRows = rows;
  solution = [];
  hidden = [];

  const cap = bottomCap(rows);
  const bottom = [];
  for(let i = 0; i < rows; i++) bottom.push(randInt(1, cap));
  solution[rows - 1] = bottom;

  for(let r = rows - 2; r >= 0; r--){
    const row = [];
    const below = solution[r + 1];
    for(let i = 0; i <= r; i++){
      row.push(below[i] + below[i + 1]);
    }
    solution[r] = row;
  }

  // minimal reveal: only the bottom row is given, everything else
  // must be worked out (still always solvable by summing upward).
  for(let r = 0; r < rows; r++){
    const row = [];
    for(let i = 0; i <= r; i++){
      row.push(r !== rows - 1);
    }
    hidden[r] = row;
  }
}

const giveColors = ['c0', 'c1', 'c2', 'c3', 'c4'];

function renderPyramid(){
  pyramidEl.innerHTML = '';
  inputs = [];
  busy = false;

  for(let r = 0; r < currentRows; r++){
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    inputs[r] = [];

    for(let i = 0; i <= r; i++){
      const cellEl = document.createElement('div');

      if(hidden[r][i]){
        cellEl.className = 'cell';
        const input = document.createElement('input');
        input.type = 'text';
        input.inputMode = 'numeric';
        input.maxLength = 3;
        input.addEventListener('input', () => {
          input.value = input.value.replace(/[^0-9]/g, '');
        });
        cellEl.appendChild(input);
        inputs[r][i] = input;
      } else {
        cellEl.className = 'cell given ' + giveColors[i % giveColors.length];
        cellEl.textContent = solution[r][i];
        inputs[r][i] = null;
      }

      rowEl.appendChild(cellEl);
    }

    pyramidEl.appendChild(rowEl);
  }
}

function handleCheck(){
  if(busy) return;

  let allFilled = true;
  for(let r = 0; r < currentRows; r++){
    for(let i = 0; i <= r; i++){
      const input = inputs[r][i];
      if(input && input.value.trim() === ''){
        allFilled = false;
      }
    }
  }

  if(!allFilled){
    pyramidEl.classList.remove('shake');
    void pyramidEl.offsetWidth;
    pyramidEl.classList.add('shake');
    return;
  }

  let allCorrect = true;
  for(let r = 0; r < currentRows; r++){
    for(let i = 0; i <= r; i++){
      const input = inputs[r][i];
      if(input && parseInt(input.value, 10) !== solution[r][i]){
        allCorrect = false;
      }
    }
  }

  if(allCorrect){
    busy = true;
    flash(false);
    launchConfetti();
    setTimeout(() => startPuzzle(currentRows), 900);
  } else {
    flash(true);
  }
}

function flash(isWrong){
  flashEl.classList.toggle('wrong', isWrong);
  flashEl.classList.add('on');
  setTimeout(() => flashEl.classList.remove('on'), 500);
}

function startPuzzle(rows){
  generatePuzzle(rows);
  renderPyramid();
  setActiveRowButton(rows);
}

function setActiveRowButton(rows){
  rowButtons.forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.rows, 10) === rows);
  });
}

newBtn.addEventListener('click', () => startPuzzle(currentRows));
checkBtn.addEventListener('click', handleCheck);
rowButtons.forEach(btn => {
  btn.addEventListener('click', () => startPuzzle(parseInt(btn.dataset.rows, 10)));
});

startPuzzle(currentRows);

/* ---- confetti ---- */
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let confettiRunning = false;

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const confettiColors = ['#3ddc84', '#4fc3f7', '#ffa94d', '#ff7aa8', '#ffd93d', '#b388ff'];

function launchConfetti(){
  particles = [];
  const count = 180;
  for(let i = 0; i < count; i++){
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 15,
      vy: (Math.random() - 1.6) * 15,
      size: randInt(5, 10),
      color: confettiColors[randInt(0, confettiColors.length - 1)],
      rotation: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.3,
      life: 0
    });
  }
  if(!confettiRunning){
    confettiRunning = true;
    requestAnimationFrame(animateConfetti);
  }
}

function animateConfetti(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let stillAlive = false;

  for(const p of particles){
    p.vy += 0.35;
    p.x += p.vx;
    p.y += p.vy;
    p.rotation += p.spin;
    p.life++;

    if(p.y < canvas.height + 20 && p.life < 220){
      stillAlive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    }
  }

  if(stillAlive){
    requestAnimationFrame(animateConfetti);
  } else {
    confettiRunning = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}
</script>

</body>
</html>
